<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        .emoji {
            font-size: 70px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            color: #667eea;
            font-size: 28px;
            margin: 20px 0;
            font-weight: 700;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .option-btn {
            padding: 18px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .option-btn.danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .option-btn.danger:hover {
            box-shadow: 0 12px 30px rgba(255, 107, 107, 0.4);
        }

        .message {
            display: none;
            padding: 20px;
            background: #ffebee;
            border-radius: 15px;
            margin-top: 20px;
            color: #c62828;
            font-weight: 600;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        .star {
            position: absolute;
            font-size: 20px;
            animation: twinkle 3s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .progress {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #667eea;
            transform: scale(1.2);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .option-btn {
                padding: 15px 25px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="progress">
            <div class="progress-dot active"></div>
            <div class="progress-dot"></div>
            <div class="progress-dot"></div>
            <div class="progress-dot"></div>
        </div>

        <div class="emoji">🤫</div>
        <h1>I have something important to tell you...</h1>
        <p style="color: #666; font-size: 16px; margin-bottom: 25px;">But first, I need to know something...</p>
        
        <div class="options">
            <button class="option-btn" onclick="selectOption('curious')">I'm listening... �</button>
            <button class="option-btn" onclick="selectOption('excited')">Tell me now! I'm excited! 🎉</button>
            <button class="option-btn" onclick="selectOption('intrigued')">You've got my attention... 😏</button>
            <button class="option-btn danger" onclick="selectOption('stop')">I don't care 🙅‍♀️</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        function selectOption(option) {
            const messageDiv = document.getElementById('message');
            
            if (option === 'stop') {
                messageDiv.style.display = 'block';
                messageDiv.textContent = "Sorry, this option is not allowed! 😜 Try another one!";
                sendResponse('question1', 'Don\'t message me again (blocked)');
                return;
            }
            
            const answers = {
                'curious': 'I\'m listening...',
                'excited': 'Tell me now! I\'m excited!',
                'intrigued': 'You\'ve got my attention...'
            };
            
            sendResponse('question1', answers[option]);
            setTimeout(() => {
                window.location.href = 'page2.html';
            }, 500);
        }

        async function sendResponse(question, answer) {
            try {
                await fetch('/api/response', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        answer: answer,
                        timestamp: new Date().toISOString()
                    })
                });
            } catch (error) {
                console.error('Error sending response:', error);
            }
        }

        // Create twinkling stars
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = '✨';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 3 + 's';
            document.getElementById('stars').appendChild(star);
        }
    </script>
</body>
</html>
